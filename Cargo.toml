[package]
name = "timeless-acct"
version = "0.2.1"
edition = "2021"
license = "MIT"
description = "Linux system and process accounting history in timeless-libsql: sar-style system stats, per-process series, and an exit record for every process — with rewind."
repository = "https://github.com/awksedgreep/timeless-acct"

[features]
default = ["embedded", "http", "watch"]
# Own a local SQLite database through the in-process timeless-libsql engine.
embedded = ["dep:rusqlite", "dep:timeless-ext"]
# Push to the Timeless planes, which is what the canvas reads.
http = ["dep:ureq"]
# Watch a local store in a terminal, now and at any moment it holds.
watch = ["embedded", "dep:ratatui", "dep:crossterm"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
serde_json = "1"
signal-hook = "0.3"
# bundled: one binary, no dependency on the host's sqlite. Must resolve to the
# same rusqlite 0.40 package as timeless-ext, whose registration call takes
# this crate's Connection type.
rusqlite = { version = "0.40.1", features = ["bundled"], optional = true }
# Tracks timeless-libsql main; Cargo.lock records the resolved commit and
# `cargo update -p timeless-ext` moves it.
timeless-ext = { git = "https://github.com/awksedgreep/timeless-libsql", default-features = false, features = ["embedded"], optional = true }
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }
# Blocking by design: a collector on a fixed tick has no use for a runtime.
ureq = { version = "2", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "timeless-acct"
path = "src/main.rs"
